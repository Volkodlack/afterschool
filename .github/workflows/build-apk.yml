name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Download AI voice, speech recognition and speech engine
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee -a build.log) 2>&1
          V=1.12.40
          curl -fSL --retry 3 -o libs.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$V/sherpa-onnx-v$V-android.tar.bz2"
          mkdir -p libs && tar xjf libs.tar.bz2 -C libs
          find libs -name "*.so" | head -20
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            cp $(find libs -path "*/$abi/*.so") app/src/main/jniLibs/$abi/
          done
          curl -fSL --retry 3 -o voice.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-siwis-medium.tar.bz2"
          mkdir -p voice && tar xjf voice.tar.bz2 -C voice
          D=$(dirname $(find voice -name tokens.txt | head -1))
          mkdir -p app/src/main/assets/tts
          cp $(find $D -maxdepth 1 -name "*.onnx" | head -1) app/src/main/assets/tts/model.onnx
          cp $D/tokens.txt app/src/main/assets/tts/
          cp -r $D/espeak-ng-data app/src/main/assets/tts/
          ls -la app/src/main/jniLibs/* app/src/main/assets/tts
          du -sh app/src/main/assets/tts
          curl -fSL --retry 3 -o asr.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-fr-kroko-2025-08-06.tar.bz2"
          mkdir -p asr && tar xjf asr.tar.bz2 -C asr
          A=$(dirname $(find asr -name tokens.txt | head -1))
          mkdir -p app/src/main/assets/asr
          cp $A/encoder.onnx $A/decoder.onnx $A/joiner.onnx $A/tokens.txt app/src/main/assets/asr/
          du -sh app/src/main/assets/asr

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="AfterSchool-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v1.0.${{ github.run_number }}" "$APK" \
            --title "After School 1.0.${{ github.run_number }}" \
            --notes "APK prête à installer sur la tablette." --latest

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          tail -n 400 build.log > build-error.log
          gh release create "build-failed-${{ github.run_number }}" build-error.log \
            --title "Build échoué #${{ github.run_number }}" --notes "Log de compilation" --prerelease
