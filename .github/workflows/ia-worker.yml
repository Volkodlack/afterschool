name: IA de correction (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/ia-worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Déployer
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.20.0 deploy 2>&1 | tee deploy.log
      - name: Tester
        working-directory: worker
        run: |
          URL=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "Adresse : $URL"
          [ -n "$URL" ] || exit 0
          sleep 5
          curl -s -X POST "$URL/fix" -H 'Origin: https://afterschool.sinisterkid.win' -H 'Content-Type: application/json' \
            -d '{"kind":"texte","text":"Le petit loup marche dans la foret. Il a peur car lenfant crie. Quil est mignon ! Il va a la mai-\nson de sa grand- mere."}'
