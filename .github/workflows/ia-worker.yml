name: IA de correction (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/ia-worker.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ia-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Déployer
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4.162.0 deploy 2>&1 | tee deploy.log; then
            echo "::error::Déploiement refusé par Cloudflare. La clé CF_API_TOKEN doit avoir le droit « Workers Scripts : Modifier » (Account → Workers Scripts → Edit), en plus de « Workers AI »."
            exit 1
          fi
      - name: Tester et enregistrer l'adresse dans l'appli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(grep -o 'https://[a-z0-9.-]*workers\.dev' worker/deploy.log | head -1)
          echo "Adresse : $URL"
          [ -n "$URL" ] || { echo "::error::Adresse workers.dev introuvable (activer le sous-domaine workers.dev dans Cloudflare › Workers)"; exit 1; }
          sleep 8
          curl -s -X POST "$URL/fix" -H 'Origin: https://afterschool.sinisterkid.win' -H 'Content-Type: application/json' \
            -d '{"kind":"texte","text":"Le petit loup marche dans la foret. Il a peur car lenfant crie. Quil est mignon ! Il va a la mai-\nson de sa grand- mere."}' | tee test.json
          echo
          F=app/src/main/assets/js/iaconfig.js
          if ! grep -q "'$URL'" $F; then
            sed -i "s#^window.AS_IA_URL = .*#window.AS_IA_URL = '$URL';#" $F
            git config user.name "Maxime Samain"; git config user.email "max.samain@gmail.com"
            git add $F && git commit -q -m "IA de correction : adresse du service" && git pull -q --rebase && git push -q
            gh workflow run web.yml --ref main
          fi
