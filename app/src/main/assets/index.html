<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>After School</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="world-bg" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="hills"></div>
  <div class="ground"></div>
</div>

<div id="topbar">
  <button id="btn-back" class="pix-btn icon-btn" aria-label="Retour"></button>
  <div id="screen-title"></div>
  <div id="hud">
    <div id="hud-me" class="hud-chip"></div>
    <div id="hud-streak" class="hud-chip" title="Jours d'affilée"></div>
    <div id="hud-gems" class="hud-chip"></div>
    <div id="hud-stars" class="hud-chip" title="Étoiles pour ton compagnon"></div>
    <div id="hud-level" class="hud-chip">
      <span class="lvl-num"></span>
      <div class="xpbar"><div class="xpfill"></div></div>
    </div>
  </div>
</div>

<main id="screen"></main>
<div id="fx-layer" aria-hidden="true"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/native.js"></script>
<script src="js/store.js"></script>
<script src="js/pixel.js"></script>
<script src="js/theme.js"></script>
<script src="js/fr.js"></script>
<script src="js/ui.js"></script>
<script src="js/games.js"></script>
<script src="js/games2.js"></script>
<script src="js/fluence.js"></script>
<script src="js/parent.js"></script>
<script src="js/cardsets.js"></script>
<script src="js/cards.js"></script>
<script src="js/pet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
